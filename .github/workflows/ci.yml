# ---------------------------------------------------------------------------
# DocuTrust CI
#
# Stages: backend build/test, frontend build/test, security scanning, image build.
#
# Nothing here requires paid infrastructure and nothing deploys anywhere.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B compile

      # The backend's local profile uses H2 and filesystem storage, so the full
      # unit, cryptographic and attack suites run with no services required.
      - name: Run tests
        working-directory: backend
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what the lockfile pins, so CI cannot silently
      # test a different dependency set than a developer did.
      - name: Install
        working-directory: frontend
        run: npm ci

      # Type checking is part of the build script, so a type error fails here.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Runs regardless of test outcome: a vulnerability report is useful even
    # when something else is failing.
    needs: [backend, frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # OWASP Dependency-Check against the backend's dependency tree.
      # No suppression file is committed, so a new advisory surfaces rather
      # than being silently ignored.
      - name: OWASP Dependency-Check (backend)
        working-directory: backend
        continue-on-error: true
        run: >
          mvn -B org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=8
          -DassemblyAnalyzerEnabled=false

      - name: npm audit (frontend)
        working-directory: frontend
        continue-on-error: true
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  # Detects key material or credentials reaching the repository. .gitignore
  # prevents accidents; this catches a deliberate `git add -f`.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed key material
        run: |
          echo "Scanning for key material and secrets..."
          FOUND=0
          # Key and keystore files must never be tracked.
          if git ls-files | grep -E '\.(p12|pfx|jks|key|pem|der)$'; then
            echo "::error::Key material is tracked in the repository."
            FOUND=1
          fi
          # A committed .env would carry real credentials.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in the repository."
            FOUND=1
          fi
          # PEM private key headers anywhere in tracked content.
          if git grep -I -l -E 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ; then
            echo "::error::A private key block appears in tracked content."
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No key material found in tracked files."

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Images are built to prove the Dockerfiles work. Nothing is pushed.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: docutrust-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: docutrust-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: docutrust-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
