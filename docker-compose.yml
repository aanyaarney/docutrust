# ---------------------------------------------------------------------------
# DocuTrust - full local stack
#
#   cp .env.example .env    # then edit the CHANGE_ME values
#   docker compose up -d
#
# No secret has a default here. Compose substitutes from .env, and a missing
# required value fails the command rather than silently starting an insecure
# service.
#
# Optional profiles:
#   docker compose --profile observability up -d   # Prometheus + Grafana
# ---------------------------------------------------------------------------

services:

  postgres:
    image: postgres:16-alpine
    container_name: docutrust-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this: starting before the database is accepting
      # connections makes Flyway fail and the container restart-loop.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: docutrust-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: creates the bucket the backend writes to, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: docutrust-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      echo 'Bucket ready.'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-docutrust-documents}
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docutrust-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-docutrust-documents}
      DOCUTRUST_JWT_SECRET: ${DOCUTRUST_JWT_SECRET:?set DOCUTRUST_JWT_SECRET in .env}
      DOCUTRUST_JWT_TTL_MINUTES: ${DOCUTRUST_JWT_TTL_MINUTES:-60}
      DOCUTRUST_PKCS12_PATH: ${DOCUTRUST_PKCS12_PATH:-}
      DOCUTRUST_PKCS12_PASSWORD: ${DOCUTRUST_PKCS12_PASSWORD:-}
      DOCUTRUST_TRUSTSTORE_PATH: ${DOCUTRUST_TRUSTSTORE_PATH:-}
      DOCUTRUST_TRUSTSTORE_PASSWORD: ${DOCUTRUST_TRUSTSTORE_PASSWORD:-}
      DOCUTRUST_TSA_ENABLED: ${DOCUTRUST_TSA_ENABLED:-false}
      DOCUTRUST_REVOCATION_ENABLED: ${DOCUTRUST_REVOCATION_ENABLED:-false}
      DOCUTRUST_MAX_UPLOAD_SIZE_MB: ${DOCUTRUST_MAX_UPLOAD_SIZE_MB:-25}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Key material is mounted read-only and never baked into the image.
      - ./pki-local:/app/pki-local:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docutrust-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  # ----------------------- optional observability -------------------------
  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: docutrust-prometheus
    profiles: ["observability"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    container_name: docutrust-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
